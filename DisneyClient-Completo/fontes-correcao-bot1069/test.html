<!doctype html><meta charset="utf-8"><title>RoutePlayer integration test</title>
<script>window.recordTestStage=s=>console.log("TEST_STAGE "+s);window.recordTest=(s)=>{window.testResult=s;document.title=s};window.RufflePlayer={config:{autoplay:'on',unmuteOverlay:'hidden',logLevel:'warn'}};</script>
<script src="ruffle/package/ruffle.js"></script>
<script>window.addEventListener('load',async()=>{window.actualRoutes=await (await fetch('routes-fixture.json')).json();window.getTestOrigin=()=>window.location.origin+'/';window.getRoutes=()=>window.actualRoutes;window.routeCase=JSON.stringify(await(await fetch("route-2294519.json")).json());window.getRouteCase=()=>window.routeCase;window.corpusEntries=Object.entries(await(await fetch("fixtures/mapas_e_rotas_por_id.json")).json()).filter(([id,v])=>Array.isArray(v.rota)&&v.rota.length);window.recordedCorpus=window.corpusEntries.map(([id,v])=>JSON.stringify(v.rota));window.convertedPlans={};window.recordConvertedRoute=(i,plan)=>{window.convertedPlans[window.corpusEntries[i][0]]=JSON.parse(plan).map(t=>({keys:[...(t.direction<0?["LEFT"]:t.direction>0?["RIGHT"]:[]),...(t.jump?["UP"]:[]),...(t.down?["DOWN"]:[])],hold_ms:t.holdMs,old_ms:t.oldMs,kind:t.kind,target:t.kind==="move"?{x:t.targetX,y:t.targetY}:null,source_index:t.source,checkpoints:t.checks}));};window.getRecordedRouteCount=()=>window.recordedCorpus.length;window.getRecordedRoute=i=>window.recordedCorpus[i];window.recordCorpusProgress=n=>console.log("TEST_CORPUS "+n+"/"+window.recordedCorpus.length);let p=window.RufflePlayer.newest().createPlayer();p.style.width='800px';p.style.height='600px';document.body.appendChild(p);await p.ruffle().load({url:'test.swf',allowScriptAccess:true});});</script>
