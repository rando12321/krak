<!doctype html><meta charset="utf-8"><title>RoutePlayer integration test</title>
<script>window.recordTestStage=s=>console.log("TEST_STAGE "+s);window.recordTest=(s)=>{window.testResult=s;document.title=s};window.RufflePlayer={config:{autoplay:'on',unmuteOverlay:'hidden',logLevel:'warn'}};</script>
<script src="ruffle/package/ruffle.js"></script>
<script>window.addEventListener('load',async()=>{window.actualRoutes=await (await fetch('routes-fixture.json')).json();window.getRoutes=()=>window.actualRoutes;window.routeCase=JSON.stringify(await(await fetch("route-2294519.json")).json());window.getRouteCase=()=>window.routeCase;window.recordedCorpus=Object.values(await(await fetch("fixtures/mapas_e_rotas_por_id.json")).json()).filter(v=>Array.isArray(v.rota)&&v.rota.length).map(v=>JSON.stringify(v.rota));window.getRecordedRouteCount=()=>window.recordedCorpus.length;window.getRecordedRoute=i=>window.recordedCorpus[i];window.recordCorpusProgress=n=>console.log("TEST_CORPUS "+n+"/"+window.recordedCorpus.length);let p=window.RufflePlayer.newest().createPlayer();p.style.width='800px';p.style.height='600px';document.body.appendChild(p);await p.ruffle().load({url:'test.swf',allowScriptAccess:true});});</script>
